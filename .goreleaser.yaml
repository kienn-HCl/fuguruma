version: 2

project_name: fuguruma

# The web UI is built by the workflow before GoReleaser runs (it is embedded with go:embed).
builds:
  - main: ./cmd/fuguruma
    binary: fuguruma
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    # Extract into a directory of the same name instead of the current one.
    wrap_in_directory: true
    files:
      - LICENSE
      - THIRD_PARTY_NOTICES.md
      - README.md
      - deploy/*

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
